name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          DONATIONS_ARS_PER_USD: ${{ secrets.DONATIONS_ARS_PER_USD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MERCADOPAGO_ACCESS_TOKEN,DONATIONS_ARS_PER_USD
          script: |
            set -euo pipefail
            cd /opt/woaoweb
            git fetch origin main
            git reset --hard origin/main
            cd deploy

            # Copia al .env del VPS los secrets de GitHub que estén cargados (los vacíos se ignoran).
            upsert_env() {
              local key="$1" value="$2"
              [ -z "$value" ] && return 0
              if grep -q "^${key}=" .env; then
                UPSERT_KEY="$key" UPSERT_VALUE="$value" awk 'BEGIN { k = ENVIRON["UPSERT_KEY"]; v = ENVIRON["UPSERT_VALUE"] } index($0, k "=") == 1 { print k "=" v; next } { print }' .env > .env.tmp
                mv .env.tmp .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            upsert_env MERCADOPAGO_ACCESS_TOKEN "${MERCADOPAGO_ACCESS_TOKEN:-}"
            upsert_env DONATIONS_ARS_PER_USD "${DONATIONS_ARS_PER_USD:-}"

            docker compose -f docker-compose.hostinger.yml --env-file .env up -d --build
            docker compose -f docker-compose.hostinger.yml --env-file .env ps
