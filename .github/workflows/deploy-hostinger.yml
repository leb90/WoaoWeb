name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          MOONPAY_PUBLISHABLE_KEY: ${{ secrets.MOONPAY_PUBLISHABLE_KEY }}
          MOONPAY_SECRET_KEY: ${{ secrets.MOONPAY_SECRET_KEY }}
          MOONPAY_WEBHOOK_KEY: ${{ secrets.MOONPAY_WEBHOOK_KEY }}
          MOONPAY_WALLET_ADDRESS: ${{ secrets.MOONPAY_WALLET_ADDRESS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MOONPAY_PUBLISHABLE_KEY,MOONPAY_SECRET_KEY,MOONPAY_WEBHOOK_KEY,MOONPAY_WALLET_ADDRESS
          script: |
            set -euo pipefail
            cd /opt/woaoweb
            git fetch origin main
            git reset --hard origin/main
            cd deploy

            # Copia al .env del VPS los secrets de GitHub que estén cargados (los vacíos se ignoran).
            upsert_env() {
              local key="$1" value="$2"
              [ -z "$value" ] && return 0
              if grep -q "^${key}=" .env; then
                UPSERT_KEY="$key" UPSERT_VALUE="$value" awk 'BEGIN { k = ENVIRON["UPSERT_KEY"]; v = ENVIRON["UPSERT_VALUE"] } index($0, k "=") == 1 { print k "=" v; next } { print }' .env > .env.tmp
                mv .env.tmp .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            upsert_env MOONPAY_PUBLISHABLE_KEY "${MOONPAY_PUBLISHABLE_KEY:-}"
            upsert_env MOONPAY_SECRET_KEY "${MOONPAY_SECRET_KEY:-}"
            upsert_env MOONPAY_WEBHOOK_KEY "${MOONPAY_WEBHOOK_KEY:-}"
            upsert_env MOONPAY_WALLET_ADDRESS "${MOONPAY_WALLET_ADDRESS:-}"

            docker compose -f docker-compose.hostinger.yml --env-file .env up -d --build
            docker compose -f docker-compose.hostinger.yml --env-file .env ps
