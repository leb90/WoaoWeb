services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aoweb}
      POSTGRES_USER: ${POSTGRES_USER:-aoweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../database/aoweb.sql:/docker-entrypoint-initdb.d/01-aoweb.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aoweb} -d ${POSTGRES_DB:-aoweb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgresql://${POSTGRES_USER:-aoweb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aoweb}
      TOKEN_AUTH: ${TOKEN_AUTH:?TOKEN_AUTH is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${APP_DOMAIN}}
      SITE_URL: https://${APP_DOMAIN}
      API_PUBLIC_URL: https://${API_DOMAIN}
      GAME_SERVER_URL: http://game-server:7666
      GAME_DATA_ADMIN_EMAIL: ${GAME_DATA_ADMIN_EMAIL:-}
      GAME_DATA_ADMIN_ACCOUNT_ID: ${GAME_DATA_ADMIN_ACCOUNT_ID:-}
      GAME_DATA_ADMIN_PROXY_TOKEN: ${GAME_DATA_ADMIN_PROXY_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      DONATIONS_ARS_PER_USD: ${DONATIONS_ARS_PER_USD:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  game-server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AOWEB_TEST_MODE: "false"
      INITIAL_ONLINE_RECORD: ${INITIAL_ONLINE_RECORD:-0}
      PORT: 7666
      API_BASE_URL: http://api:3100
      RESET_CONNECTED_CHARACTERS_ON_STARTUP: ${RESET_CONNECTED_CHARACTERS_ON_STARTUP:-true}
      TOKEN_AUTH: ${TOKEN_AUTH:?TOKEN_AUTH is required}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - game_server_data:/app/data
    expose:
      - "7666"

  frontend:
    build:
      context: ../frontend
      args:
        API_BASE_URL: http://api:3100
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${WS_DOMAIN}
        NEXT_PUBLIC_AOWEB_TEST_MODE: ${NEXT_PUBLIC_AOWEB_TEST_MODE:-false}
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
        SITE_URL: https://${APP_DOMAIN}
        NEXT_BUILD_ID: ${NEXT_BUILD_ID:-}
        GAME_DATA_ADMIN_PROXY_TOKEN: ${GAME_DATA_ADMIN_PROXY_TOKEN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://api:3100
      TOKEN_AUTH: ${TOKEN_AUTH:?TOKEN_AUTH is required}
      NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${WS_DOMAIN}
      NEXT_PUBLIC_AOWEB_TEST_MODE: ${NEXT_PUBLIC_AOWEB_TEST_MODE:-false}
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
      SITE_URL: https://${APP_DOMAIN}
      NEXT_BUILD_ID: ${NEXT_BUILD_ID:-}
      GAME_DATA_ADMIN_PROXY_TOKEN: ${GAME_DATA_ADMIN_PROXY_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      game-server:
        condition: service_started
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      WS_DOMAIN: ${WS_DOMAIN:?WS_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      - frontend
      - api
      - game-server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  game_server_data:
  caddy_data:
  caddy_config:
